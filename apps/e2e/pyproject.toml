[project]
name = "anywidget-mcp-atlas-tests"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["anywidget-mcp==0.0.3", "embedding-atlas==0.24.0", "torch==2.14.0"]

[dependency-groups]
dev = ["pyrefly==1.2.0", "ruff==0.16.6", "ty==0.0.78"]

[tool.pyrefly]
project-includes = ["atlas_server.py"]

[tool.uv]
package = false
exclude-newer = "2 days"

[tool.uv.sources]
anywidget-mcp = { path = "../../packages/anywidget-mcp", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
