name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check JavaScript formatting, linting, and types
        run: vp run check

      - name: Check Python formatting, linting, and types
        run: |
          uv lock --check
          uv run --package anywidget-mcp ruff format --check packages/anywidget-mcp scripts
          uv run --package anywidget-mcp ruff check packages/anywidget-mcp scripts
          uv run --package anywidget-mcp ty check packages/anywidget-mcp scripts
          uv run --package anywidget-mcp pyrefly check --min-severity warn

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Check whitespace
        run: git diff --check

  test-python:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build browser resource
        run: vp run -F @anywidget-mcp/python build

      - name: Run Python tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --package anywidget-mcp pytest -q packages/anywidget-mcp/tests

  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run JavaScript tests
        run: vp run -r test

      - name: Build browser package
        run: vp run -F @anywidget-mcp/app build

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.2.4
          node-version: ${{ steps.node-version.outputs.version }}
          cache: true
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build and check package artifacts
        run: make package

      - name: Check generated files
        run: git diff --exit-code

  required:
    if: always()
    needs: [quality, test-python, test-js, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          PACKAGE: ${{ needs.package.result }}
          QUALITY: ${{ needs.quality.result }}
          TEST_JS: ${{ needs.test-js.result }}
          TEST_PYTHON: ${{ needs.test-python.result }}
        run: |
          if [ "$QUALITY" != success ] || \
             [ "$TEST_PYTHON" != success ] || \
             [ "$TEST_JS" != success ] || \
             [ "$PACKAGE" != success ]; then
            printf 'Required jobs: quality=%s test-python=%s test-js=%s package=%s\n' \
              "$QUALITY" "$TEST_PYTHON" "$TEST_JS" "$PACKAGE" >&2
            exit 1
          fi
