name: Publish package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check release version
        shell: bash
        run: |
          package_version="$(uv version --package anywidget-mcp --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Select validated main artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          run_id="$(gh run list --workflow ci.yml --branch main --commit "$commit" \
            --event push --limit 1 --json databaseId,status,conclusion \
            --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .databaseId')"
          if [ -z "$run_id" ]; then
            echo "A successful main CI run is required for $commit" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: |
            dist/anywidget_mcp-*.whl
            dist/anywidget_mcp-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/anywidget-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Download package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Publish package
        run: uv publish --trusted-publishing always dist/anywidget_mcp-*.whl dist/anywidget_mcp-*.tar.gz

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Wait for the public PyPI index
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="anywidget_mcp-${version}-py3-none-any.whl"
          sdist="anywidget_mcp-${version}.tar.gz"
          for attempt in $(seq 1 18); do
            if page="$(curl --fail --silent --show-error https://pypi.org/simple/anywidget-mcp/)" && \
               grep -Fq "$wheel" <<< "$page" && grep -Fq "$sdist" <<< "$page"; then
              exit 0
            fi
            printf 'PyPI index attempt %s of 18 did not find both artifacts for %s\n' \
              "$attempt" "$version"
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          echo "PyPI did not publish both artifacts for $version within three minutes" >&2
          exit 1

      - name: Verify the installed package
        env:
          UV_NO_CONFIG: "1"
        run: >-
          uv run --no-cache --no-project --isolated
          --default-index https://pypi.org/simple
          --with "anywidget-mcp[server]==${GITHUB_REF_NAME#v}"
          python scripts/verify_release.py "${GITHUB_REF_NAME#v}"

  release-notes:
    needs: [publish, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false

      - name: Update release notes
        shell: bash
        run: |
          args=()
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ (a|b|rc|dev)[0-9]+ ]]; then
            args+=(--prerelease)
          fi
          npx --yes changelogithub@14.0.0 "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
