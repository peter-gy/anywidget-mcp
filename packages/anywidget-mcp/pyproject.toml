[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anywidget-mcp"
version = "0.2.1"
description = "Expose AnyWidget interfaces through MCP Apps and WebMCP"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["anywidget", "mcp", "model-context-protocol", "webmcp"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Typing :: Typed",
]
dependencies = ["anywidget>=0.11", "exceptiongroup==1.3.1", "ipywidgets>=8.1", "traitlets>=5.14"]

[project.urls]
Documentation = "https://peter-gy.github.io/anywidget-mcp/"
Issues = "https://github.com/peter-gy/anywidget-mcp/issues"
Repository = "https://github.com/peter-gy/anywidget-mcp"

[project.scripts]
anywidget-mcp = "anywidget_mcp.cli:main"

[project.optional-dependencies]
server = ["anyio>=4", "mcp>=2", "pydantic>=2.10", "starlette>=1.6", "typing-extensions>=4.6"]

[dependency-groups]
dev = ["hatchling>=1.27"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/anywidget_mcp/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/hatch_build.py", "/pyproject.toml", "/src/anywidget_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
