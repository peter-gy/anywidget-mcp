[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anywidget-mcp"
version = "0.1.0"
description = "Expose AnyWidget interfaces as interactive MCP Apps"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
	"anyio>=4.5",
	"anywidget>=0.11.0",
	"mcp>=1.28.1,<2",
	"pydantic>=2.11,<3",
	"starlette>=0.27",
	"traitlets>=5.15.1",
]

[project.scripts]
anywidget-mcp = "anywidget_mcp.cli:main"

[dependency-groups]
dev = ["hatchling"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/anywidget_mcp/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/hatch_build.py", "/pyproject.toml", "/src/anywidget_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
