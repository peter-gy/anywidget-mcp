[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "anywidget-mcp"
version = "0.0.3"
description = "Expose AnyWidget interfaces as interactive MCP Apps"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
keywords = ["anywidget", "mcp", "model-context-protocol"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Typing :: Typed",
]
dependencies = [
	"anyio==4.15.1",
	"anywidget==0.11.0",
	"mcp==2.1.1",
	"pydantic==2.13.5",
	"starlette==1.6.0",
	"traitlets==5.16.1",
	"typing-extensions==4.16.0",
]

[project.urls]
Documentation = "https://peter-gy.github.io/anywidget-mcp/"
Issues = "https://github.com/peter-gy/anywidget-mcp/issues"
Repository = "https://github.com/peter-gy/anywidget-mcp"

[project.scripts]
anywidget-mcp = "anywidget_mcp.cli:main"

[dependency-groups]
dev = ["hatchling==1.32.0"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/anywidget_mcp/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_mcp"]

[tool.hatch.build.targets.sdist]
include = [
	"/README.md",
	"/THIRD_PARTY_NOTICES",
	"/hatch_build.py",
	"/pyproject.toml",
	"/src/anywidget_mcp",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
