[tool.uv.workspace]
members = ["packages/anywidget-mcp"]
exclude = ["apps/e2e"]

[tool.uv]
exclude-newer = "2 days"

[dependency-groups]
dev = [
	"marimo[recommended]==0.24.0",
	"pyrefly==1.2.0",
	"pytest==9.1.1",
	"ruff==0.16.6",
	"twine==7.0.0",
	"ty==0.0.78",
	"wigglystuff==0.5.32",
]

[tool.pyrefly]
project-includes = ["packages/anywidget-mcp", "scripts", "apps/e2e/server.py"]
search-path = ["packages/anywidget-mcp/src", "packages/anywidget-mcp/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/anywidget-mcp/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
