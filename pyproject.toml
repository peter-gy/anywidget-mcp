[tool.uv.workspace]
members = ["packages/anywidget-mcp", "apps/e2e"]

[tool.uv]
exclude-newer = "2 days"
exclude-newer-package = { marimo = false }

[tool.uv.sources]
anywidget-mcp = { workspace = true }

[tool.basedpyright]
include = ["packages/anywidget-mcp", "scripts", "apps/e2e"]
extraPaths = ["packages/anywidget-mcp/src", "packages/anywidget-mcp/tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
failOnWarnings = true

[dependency-groups]
dev = [
	"anywidget-mcp[server]",
	"basedpyright==1.39.10",
	"marimo[recommended]>=0.24.0",
	"pyrefly>=1.2.0",
	"pytest>=9.1.1",
	"ruff>=0.16.6",
	"twine>=7.0.0",
	"ty>=0.0.78",
	"wigglystuff==0.5.10; python_version < '3.11'",
	"wigglystuff>=0.5.32; python_version >= '3.11'",
]

[tool.ty.environment]
python-version = "3.10"

[tool.pyrefly]
python-version = "3.10"
project-includes = ["packages/anywidget-mcp", "scripts", "apps/e2e"]
search-path = ["packages/anywidget-mcp/src", "packages/anywidget-mcp/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/anywidget-mcp/tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
