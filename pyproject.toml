[tool.uv.workspace]
members = ["packages/anywidget-mcp"]

[dependency-groups]
dev = [
	"marimo[recommended]>=0.23.14",
	"pyrefly>=1.1.1",
	"pytest>=9.1.1",
	"ruff>=0.15.21",
	"ty>=0.0.59",
	"wigglystuff>=0.5.13",
]

[tool.pyrefly]
project-includes = ["packages/anywidget-mcp"]
search-path = ["packages/anywidget-mcp/src", "packages/anywidget-mcp/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/anywidget-mcp/tests"]

[tool.ruff]
target-version = "py312"
